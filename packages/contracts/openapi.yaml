openapi: 3.1.0
info: { title: Pixel8 API, version: 1.0.0 }
servers: [{ url: http://localhost:3001 }]
security: [{ bearerAuth: [] }]
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    Error:
      {
        type: object,
        required: [error],
        properties:
          {
            error:
              {
                type: object,
                required: [code, message],
                properties:
                  {
                    code: { type: string },
                    message: { type: string },
                    details: {},
                  },
              },
          },
      }
    App:
      {
        type: object,
        required: [id, name, description, createdAt],
        properties:
          {
            id: { type: string, format: uuid },
            name: { type: string },
            description: { type: [string, "null"] },
            createdAt: { type: string, format: date-time },
          },
      }
    Asset:
      {
        type: object,
        required: [id, appId, name, mimeType, sizeBytes, status],
        properties:
          {
            id: { type: string, format: uuid },
            appId: { type: string, format: uuid },
            name: { type: string },
            mimeType: { type: string },
            sizeBytes: { type: integer, format: int64 },
            status:
              { type: string, enum: [uploading, processing, ready, failed] },
            thumbnailUrl: { type: string, format: uri },
            error: { type: string },
          },
      }
    CampaignItem:
      {
        type: object,
        required: [assetId, durationSeconds, fit],
        properties:
          {
            assetId: { type: string, format: uuid },
            durationSeconds: { type: integer, minimum: 1 },
            fit: { type: string, enum: [contain, cover] },
          },
      }
    Campaign:
      {
        type: object,
        required: [id, appId, name, revision, currentRevision, status, items],
        properties:
          {
            id: { type: string, format: uuid },
            appId: { type: string, format: uuid },
            name: { type: string },
            description: { type: [string, "null"] },
            revision: { type: integer },
            currentRevision: { type: [integer, "null"] },
            status: { type: string, enum: [preparing, ready, failed] },
            items:
              {
                type: array,
                items: { $ref: "#/components/schemas/CampaignItem" },
              },
            error: { type: string },
          },
      }
    DisplayMode:
      {
        type: object,
        required: [width, height, refreshHz],
        properties:
          {
            width: { type: integer },
            height: { type: integer },
            refreshHz: { type: number },
          },
      }
    Capabilities:
      {
        type: object,
        required:
          [
            displayModes,
            selectedMode,
            decoders,
            supports1080p,
            softwareVersion,
          ],
        properties:
          {
            displayModes:
              {
                type: array,
                items: { $ref: "#/components/schemas/DisplayMode" },
              },
            selectedMode: { $ref: "#/components/schemas/DisplayMode" },
            decoders: { type: array, items: { type: string } },
            supports1080p: { type: boolean },
            softwareVersion: { type: string },
          },
      }
    Screen:
      {
        type: object,
        required:
          [
            id,
            name,
            campaignId,
            orientation,
            muted,
            volume,
            desiredVersion,
            playingVersion,
            status,
          ],
        properties:
          {
            id: { type: string, format: uuid },
            name: { type: string },
            campaignId: { type: [string, "null"], format: uuid },
            orientation: { type: integer, enum: [0, 90, 180, 270] },
            muted: { type: boolean },
            volume: { type: integer, minimum: 0, maximum: 100 },
            desiredVersion: { type: integer },
            playingVersion: { type: [integer, "null"] },
            status:
              {
                type: string,
                enum: [offline, preparing, ready, downloading, playing, error],
              },
            lastSeenAt: { type: string, format: date-time },
            error: { type: string },
            capabilities: { $ref: "#/components/schemas/Capabilities" },
          },
      }
    ManifestItem:
      {
        type: object,
        required: [id, assetId, renditionId, sha256, sizeBytes, durationMs],
        properties:
          {
            id: { type: string, format: uuid },
            assetId: { type: string, format: uuid },
            renditionId: { type: string, format: uuid },
            sha256: { type: string },
            sizeBytes: { type: integer, format: int64 },
            durationMs: { type: integer },
          },
      }
    Manifest:
      {
        type: object,
        required:
          [
            schemaVersion,
            screenId,
            version,
            profile,
            orientation,
            muted,
            volume,
            items,
          ],
        properties:
          {
            schemaVersion: { type: integer, enum: [1] },
            screenId: { type: string, format: uuid },
            version: { type: integer },
            profile: { type: string, enum: [720p30-v1, 1080p30-v1] },
            orientation: { type: integer },
            muted: { type: boolean },
            volume: { type: integer },
            items:
              {
                type: array,
                items: { $ref: "#/components/schemas/ManifestItem" },
              },
          },
      }
    PairingRequest:
      {
        type: object,
        required: [deviceId, capabilities],
        properties:
          {
            deviceId: { type: string },
            capabilities: { $ref: "#/components/schemas/Capabilities" },
          },
      }
    TelemetrySample:
      {
        type: object,
        required:
          [
            sampledAt,
            cpuPercent,
            memoryUsedBytes,
            memoryTotalBytes,
            throttled,
            diskFreeBytes,
            cacheBytes,
            desiredVersion,
            droppedFrames,
            softwareVersion,
            displayMode,
            decoder,
          ],
        properties:
          {
            sampledAt: { type: string, format: date-time },
            cpuPercent: { type: number },
            memoryUsedBytes: { type: integer },
            memoryTotalBytes: { type: integer },
            temperatureC: { type: number },
            throttled: { type: boolean },
            diskFreeBytes: { type: integer },
            cacheBytes: { type: integer },
            currentItemId: { type: string, format: uuid },
            desiredVersion: { type: integer },
            playingVersion: { type: integer },
            droppedFrames: { type: integer },
            softwareVersion: { type: string },
            displayMode: { $ref: "#/components/schemas/DisplayMode" },
            decoder: { type: string },
            error: { type: string },
          },
      }
    AppsPage:
      {
        type: object,
        required: [items],
        properties:
          {
            items: { type: array, items: { $ref: "#/components/schemas/App" } },
          },
      }
    AssetsPage:
      {
        type: object,
        required: [items],
        properties:
          {
            items:
              { type: array, items: { $ref: "#/components/schemas/Asset" } },
          },
      }
    CampaignsPage:
      {
        type: object,
        required: [items],
        properties:
          {
            items:
              { type: array, items: { $ref: "#/components/schemas/Campaign" } },
          },
      }
    ScreensPage:
      {
        type: object,
        required: [items],
        properties:
          {
            items:
              { type: array, items: { $ref: "#/components/schemas/Screen" } },
          },
      }
    TelemetryPage:
      {
        type: object,
        required: [items],
        properties:
          {
            items:
              {
                type: array,
                items: { $ref: "#/components/schemas/TelemetrySample" },
              },
          },
      }
    AppCreate:
      {
        type: object,
        required: [name],
        properties:
          {
            name: { type: string, minLength: 1, maxLength: 120 },
            description: { type: [string, "null"], maxLength: 2000 },
          },
      }
    AppPatch:
      {
        type: object,
        properties:
          {
            name: { type: string, minLength: 1, maxLength: 120 },
            description: { type: [string, "null"], maxLength: 2000 },
          },
      }
    CampaignCreate:
      {
        type: object,
        required: [name, items],
        properties:
          {
            name: { type: string, minLength: 1, maxLength: 120 },
            description: { type: [string, "null"], maxLength: 2000 },
            items:
              {
                type: array,
                items: { $ref: "#/components/schemas/CampaignItem" },
              },
          },
      }
    CampaignUpdate:
      {
        allOf:
          [
            { $ref: "#/components/schemas/CampaignCreate" },
            {
              type: object,
              required: [expectedRevision],
              properties: { expectedRevision: { type: integer, minimum: 1 } },
            },
          ],
      }
    UploadCreate:
      {
        type: object,
        required: [name, mimeType, sizeBytes],
        properties:
          {
            name: { type: string, minLength: 1, maxLength: 255 },
            mimeType: { type: string },
            sizeBytes:
              {
                type: integer,
                format: int64,
                minimum: 1,
                maximum: 20000000000,
              },
          },
      }
    UploadStart:
      {
        type: object,
        required: [asset, uploadId, partSizeBytes],
        properties:
          {
            asset: { $ref: "#/components/schemas/Asset" },
            uploadId: { type: string, format: uuid },
            partSizeBytes: { type: integer },
          },
      }
    UploadPartsRequest:
      {
        type: object,
        required: [partNumbers],
        properties:
          {
            partNumbers:
              {
                type: array,
                minItems: 1,
                maxItems: 10000,
                items: { type: integer, minimum: 1, maximum: 10000 },
              },
          },
      }
    UploadPart:
      {
        type: object,
        required: [partNumber, url],
        properties:
          { partNumber: { type: integer }, url: { type: string, format: uri } },
      }
    UploadParts:
      {
        type: object,
        required: [parts, expiresAt],
        properties:
          {
            parts:
              {
                type: array,
                items: { $ref: "#/components/schemas/UploadPart" },
              },
            expiresAt: { type: string, format: date-time },
          },
      }
    UploadCompleteRequest:
      {
        type: object,
        required: [parts],
        properties:
          {
            parts:
              {
                type: array,
                minItems: 1,
                items:
                  {
                    type: object,
                    required: [partNumber, etag],
                    properties:
                      {
                        partNumber: { type: integer, minimum: 1 },
                        etag: { type: string },
                      },
                  },
              },
          },
      }
    ScreenPairRequest:
      {
        type: object,
        required: [code, name],
        properties:
          {
            code: { type: string, minLength: 8, maxLength: 8 },
            name: { type: string, minLength: 1, maxLength: 120 },
          },
      }
    ScreenPatch:
      {
        type: object,
        required: [expectedDesiredVersion],
        properties:
          {
            expectedDesiredVersion: { type: integer, minimum: 1 },
            name: { type: string, minLength: 1, maxLength: 120 },
            campaignId: { type: [string, "null"], format: uuid },
            orientation: { type: integer, enum: [0, 90, 180, 270] },
            muted: { type: boolean },
            volume: { type: integer, minimum: 0, maximum: 100 },
          },
      }
    PairingStart:
      {
        type: object,
        required: [pairingId, code, pollToken, expiresAt],
        properties:
          {
            pairingId: { type: string, format: uuid },
            code: { type: string },
            pollToken: { type: string },
            expiresAt: { type: string, format: date-time },
          },
      }
    PairingPollRequest:
      {
        type: object,
        required: [pollToken],
        properties: { pollToken: { type: string, minLength: 32 } },
      }
    PairingPoll:
      {
        oneOf:
          [
            {
              type: object,
              required: [status],
              properties: { status: { const: pending } },
            },
            {
              type: object,
              required: [status],
              properties: { status: { const: expired } },
            },
            {
              type: object,
              required: [status, deviceToken, screenId],
              properties:
                {
                  status: { const: claimed },
                  deviceToken: { type: string },
                  screenId: { type: string, format: uuid },
                },
            },
          ],
      }
    ScreenTelemetry:
      {
        type: object,
        required: [hours],
        properties: { hours: { type: integer, minimum: 1, maximum: 168 } },
      }
    DownloadsRequest:
      {
        type: object,
        required: [renditionIds],
        properties:
          {
            renditionIds:
              {
                type: array,
                minItems: 1,
                maxItems: 200,
                items: { type: string, format: uuid },
              },
          },
      }
    Download:
      {
        type: object,
        required: [renditionId, url, expiresAt],
        properties:
          {
            renditionId: { type: string, format: uuid },
            url: { type: string, format: uri },
            expiresAt: { type: string, format: date-time },
          },
      }
    Downloads:
      {
        type: object,
        required: [downloads],
        properties:
          {
            downloads:
              { type: array, items: { $ref: "#/components/schemas/Download" } },
          },
      }
    PlaybackAck:
      {
        type: object,
        required: [version, status],
        properties:
          {
            version: { type: integer, minimum: 1 },
            status:
              {
                type: string,
                enum: [downloading, playing, idle, error],
                description: "idle is valid only when the acknowledged manifest has no items; playing is valid only when it has items.",
              },
            currentItemId: { type: string, format: uuid },
            playingVersion: { type: [integer, "null"], minimum: 1, description: "For error acknowledgements, the manifest version still playing, or null if playback stopped. If omitted, existing playback state is left unchanged." },
            error: { type: string, maxLength: 2000 },
          },
      }
    TelemetryRequest:
      {
        type: object,
        required: [samples],
        properties:
          {
            samples:
              {
                type: array,
                minItems: 1,
                maxItems: 100,
                items: { $ref: "#/components/schemas/TelemetrySample" },
              },
          },
      }
    Preview:
      {
        type: object,
        required: [url, expiresAt, mimeType],
        properties:
          {
            url: { type: string, format: uri },
            expiresAt: { type: string, format: date-time },
            mimeType: { type: string },
          },
      }
    DeleteCampaign:
      {
        type: object,
        properties: { unassignScreens: { type: boolean, enum: [true] } },
      }
    Accepted:
      {
        type: object,
        required: [accepted],
        properties: { accepted: { type: integer } },
      }
    Ok: { type: object, required: [ok], properties: { ok: { type: boolean } } }
  parameters:
    Id:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    AppId:
      {
        name: appId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    UploadId:
      {
        name: uploadId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    PairingId:
      {
        name: pairingId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  responses:
    Unauthorized:
      {
        description: Authentication required,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    NotFound:
      {
        description: Not found,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Conflict:
      {
        description: Version conflict,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Invalid:
      {
        description: Invalid request,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Error" } },
          },
      }
    Deleted:
      {
        description: Deleted,
        content:
          { application/json: { schema: { $ref: "#/components/schemas/Ok" } } },
      }
  requestBodies:
    Capabilities:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/Capabilities" } },
          },
      }
    Telemetry:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/TelemetryRequest" } },
          },
      }
paths:
  /api/auth/{path}:
    parameters:
      [{ name: path, in: path, required: true, schema: { type: string } }]
    get:
      {
        security: [],
        operationId: authGet,
        responses: { "200": { description: Better Auth response } },
      }
    post:
      {
        security: [],
        operationId: authPost,
        responses: { "200": { description: Better Auth response } },
      }
  /v1/apps:
    get:
      {
        operationId: listApps,
        responses:
          {
            "200":
              {
                description: Apps,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/AppsPage" } },
                  },
              },
            "401": { $ref: "#/components/responses/Unauthorized" },
          },
      }
    post:
      {
        operationId: createApp,
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/AppCreate" } },
              },
          },
        responses:
          {
            "200":
              {
                description: Created app,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/App" } },
                  },
              },
            "401": { $ref: "#/components/responses/Unauthorized" },
            "422": { $ref: "#/components/responses/Invalid" },
          },
      }
  /v1/apps/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        operationId: getApp,
        responses:
          {
            "200":
              {
                description: App,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/App" } },
                  },
              },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
    patch:
      {
        operationId: patchApp,
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/AppPatch" } },
              },
          },
        responses:
          {
            "200":
              {
                description: App,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/App" } },
                  },
              },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
    delete:
      {
        operationId: deleteApp,
        responses:
          {
            "200": { $ref: "#/components/responses/Deleted" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /v1/apps/{appId}/assets:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    get:
      {
        operationId: listAssets,
        responses:
          {
            "200":
              {
                description: Assets,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/AssetsPage" } },
                  },
              },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
  /v1/assets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      {
        operationId: deleteAsset,
        responses:
          {
            "200": { $ref: "#/components/responses/Deleted" },
            "404": { $ref: "#/components/responses/NotFound" },
            "409": { $ref: "#/components/responses/Conflict" },
          },
      }
  /v1/assets/{id}/thumbnail:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        operationId: getAssetThumbnail,
        responses:
          {
            "302": { description: Private image redirect },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
  /v1/assets/{id}/preview:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        operationId: getAssetPreview,
        responses:
          {
            "200":
              {
                description: Short lived private source URL,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/Preview" } },
                  },
              },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
  /v1/apps/{appId}/uploads:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    post:
      {
        operationId: createUpload,
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/UploadCreate" } },
              },
          },
        responses:
          {
            "200":
              {
                description: Multipart upload session,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/UploadStart" } },
                  },
              },
            "422": { $ref: "#/components/responses/Invalid" },
          },
      }
  /v1/uploads/{uploadId}/parts:
    parameters: [{ $ref: "#/components/parameters/UploadId" }]
    post:
      {
        operationId: signUploadParts,
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  {
                    schema: { $ref: "#/components/schemas/UploadPartsRequest" },
                  },
              },
          },
        responses:
          {
            "200":
              {
                description: Signed upload part grants,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/UploadParts" } },
                  },
              },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
  /v1/uploads/{uploadId}/complete:
    parameters: [{ $ref: "#/components/parameters/UploadId" }]
    post:
      {
        operationId: completeUpload,
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  {
                    schema:
                      { $ref: "#/components/schemas/UploadCompleteRequest" },
                  },
              },
          },
        responses:
          {
            "200":
              {
                description: Asset,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/Asset" } },
                  },
              },
            "422": { $ref: "#/components/responses/Invalid" },
          },
      }
  /v1/uploads/{uploadId}:
    parameters: [{ $ref: "#/components/parameters/UploadId" }]
    delete:
      {
        operationId: abortUpload,
        responses:
          {
            "200": { $ref: "#/components/responses/Deleted" },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
  /v1/apps/{appId}/campaigns:
    parameters: [{ $ref: "#/components/parameters/AppId" }]
    get:
      {
        operationId: listCampaigns,
        responses:
          {
            "200":
              {
                description: Campaigns,
                content:
                  {
                    application/json:
                      {
                        schema: { $ref: "#/components/schemas/CampaignsPage" },
                      },
                  },
              },
            "404": { $ref: "#/components/responses/NotFound" },
          },
      }
    post:
      {
        operationId: createCampaign,
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/CampaignCreate" } },
              },
          },
        responses:
          {
            "200":
              {
                description: New candidate campaign,
                content:
                  {
                    application/json:
                      { schema: { $ref: "#/components/schemas/Campaign" } },
                  },
              },
            "422": { $ref: "#/components/responses/Invalid" },
          },
      }
  /v1/campaigns/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      {
        operationId: getCampaign,
        responses:
          {
            "200":
              {
